<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورات الذكية - مركز التدريب</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/courses.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">🎓 مركز التدريب</div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="courses.html">الدورات</a></li>
            <li><a href="registration.html">التسجيل</a></li>
            <li><a href="success-stories.html">قصص النجاح</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
            🌙
        </button>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1>استكشف دوراتنا التدريبية</h1>
        <p>اختر من بين مجموعة واسعة من الدورات المتخصصة</p>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <h2>فلتر الدورات</h2>
        <div class="filter-container">
            <button class="filter-btn active" data-category="all" onclick="filterCourses('all')">
                <span class="filter-icon">🎯</span>
                <span>جميع الدورات</span>
            </button>
            <button class="filter-btn" data-category="programming" onclick="filterCourses('programming')">
                <span class="filter-icon">💻</span>
                <span>البرمجة</span>
            </button>
            <button class="filter-btn" data-category="design" onclick="filterCourses('design')">
                <span class="filter-icon">🎨</span>
                <span>التصميم</span>
            </button>
            <button class="filter-btn" data-category="data" onclick="filterCourses('data')">
                <span class="filter-icon">📊</span>
                <span>البيانات</span>
            </button>
            <button class="filter-btn" data-category="marketing" onclick="filterCourses('marketing')">
                <span class="filter-icon">🌐</span>
                <span>التسويق</span>
            </button>
        </div>

        <!-- Sort Options -->
        <div class="sort-container">
            <label>ترتيب حسب:</label>
            <select id="sortSelect" onchange="sortCourses(this.value)">
                <option value="popularity">الأكثر شعبية</option>
                <option value="price-low">السعر: من الأقل للأعلى</option>
                <option value="price-high">السعر: من الأعلى للأقل</option>
                <option value="duration">المدة</option>
                <option value="level">المستوى</option>
            </select>
        </div>
    </section>

    <!-- Courses Grid -->
    <section class="courses-grid-section">
        <div class="courses-grid" id="coursesGrid">
            <!-- Course Cards will be generated by JavaScript -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">🔍</div>
            <h3>لم نجد دورات مطابقة</h3>
            <p>جرب تغيير خيارات الفلترة</p>
        </div>
    </section>

    <!-- Course Details Modal -->
    <div class="modal" id="courseModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <div id="courseDetails"></div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/language-handler.js"></script>
    <script src="js/script.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
